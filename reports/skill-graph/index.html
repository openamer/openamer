body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:10;padding:12px 24px;background:rgba(26,26,46,0.92);backdrop-filter:blur(4px);border-bottom:1px solid #2d2d5e;display:flex;align-items:center;gap:20px}
header h1{font-size:18px;font-weight:600;color:#00d4aa}

#legend .item{display:flex;align-items:center;gap:8px;padding:2px 4px;cursor:pointer;border-radius:4px}
#legend .item:hover{background:rgba(0,212,170,0.12)}
#legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#legend .lbl{color:#ccc;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg{width:100vw;height:100vh}
.links line{stroke-opacity:0.4}
.links .related{stroke:#4ecdc4}
.links .same_category{stroke:#636e72;stroke-dasharray:3,3}
.nodes circle{cursor:pointer;stroke:#fff;stroke-width:1.2}
.nodes circle:hover{stroke:#00d4aa;stroke-width:3}
.nodes text{font-size:9px;pointer-events:none;fill:#ccc;text-shadow:0 0 3px #1a1a2e,0 0 5px #1a1a2e}
#tooltip{position:fixed;z-index:20;background:rgba(26,26,46,0.97);border:1px solid #00d4aa;border-radius:8px;padding:12px 16px;pointer-events:none;opacity:0;transition:opacity 0.15s;font-size:13px;max-width:320px;box-shadow:0 4px 24px rgba(0,0,0,0.6)}
#tooltip .tt-name{color:#00d4aa;font-weight:600;font-size:14px;margin-bottom:3px}
#tooltip .tt-cat{color:#888;font-size:11px}
#tooltip .tt-desc{color:#bbb;margin-top:4px;font-size:12px;line-height:1.4}
#tooltip .tt-tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px}
#tooltip .tt-tag{background:rgba(0,212,170,0.15);color:#00d4aa;padding:1px 6px;border-radius:4px;font-size:10px}
#info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(26,26,46,0.85);backdrop-filter:blur(4px);border:1px solid #2d2d5e;border-radius:8px;padding:8px 20px;font-size:12px;color:#888;text-align:center}
#info a{color:#00d4aa;text-decoration:none}
</style>
</head>

const w = window.innerWidth, h = window.innerHeight;

const svg = d3.select("body").append("svg").attr("width",w).attr("height",h);
const gl = svg.append("g").attr("class","links");
const gn = svg.append("g").attr("class","nodes");

// Legend
const leg = document.getElementById("legend");
leg.innerHTML = "<h3>Categories</h3>";
const hidden = new Set();
const cats = [...new Set(DATA.nodes.map(d=>d.category))].sort();
cats.forEach(c => {
  const it = document.createElement("div");
  it.className = "item";
  it.innerHTML = '<span class="dot" style="background:'+CAT_COLORS[c]+'"></span><span class="lbl">'+c+'</span>';
  it.onclick = () => { if(hidden.has(c)) hidden.delete(c); else hidden.add(c); applyVis(); };
  leg.appendChild(it);
});

function applyVis() {
  nc.style("display", d=>hidden.has(d.category)?"none":null);
  nl.style("display", d=>hidden.has(d.category)?"none":null);
  lk.style("display", d=>{
    const a = DATA.nodes[d.source.id||d.source], b = DATA.nodes[d.target.id||d.target];
    return (hidden.has(a.category)||hidden.has(b.category))?"none":null;
  });
}

const sim = d3.forceSimulation(DATA.nodes)
  .force("link", d3.forceLink(DATA.edges).id(d=>d.id).distance(70))
  .force("charge", d3.forceManyBody().strength(-160))
  .force("center", d3.forceCenter(w/2,h/2))
  .force("collision", d3.forceCollide().radius(18));

const lk = gl.selectAll("line").data(DATA.edges).join("line")
  .attr("class",d=>d.type)
  .attr("stroke-width",d=>d.type==="related"?1.5:0.6)
  .attr("opacity",d=>d.type==="related"?0.5:0.15);

const nc = gn.selectAll("circle").data(DATA.nodes).join("circle")
  .attr("r",d=>4+Math.min(d.tags.length,7)*0.8)
  .attr("fill",d=>CAT_COLORS[d.category]||"#636e72")
  .call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null})
  );

const nl = gn.selectAll("text").data(DATA.nodes).join("text")
  .text(d=>d.name).attr("dx",d=>6+Math.min(d.tags.length,4)*0.8).attr("dy",".35em");

const tt = document.getElementById("tooltip");
nc.on("mouseover",function(ev,d){
  tt.style.opacity=1;
  tt.innerHTML='<div class="tt-name">'+d.name+'</div><div class="tt-cat">'+d.category+(d.subcategory?' › '+d.subcategory:'')+'</div><div class="tt-desc">'+(d.description||'No description')+'</div><div class="tt-tags">'+d.tags.map(t=>'<span class="tt-tag">'+t+'</span>').join('')+'</div>';
  const ids = new Set([d.id]);
  DATA.edges.forEach(e=>{const s=e.source.id||e.source,t=e.target.id||e.target;if(s===d.id)ids.add(t);if(t===d.id)ids.add(s);});
  nc.attr("opacity",n=>n.id===d.id||ids.has(n.id)?1:0.15);
  nl.attr("opacity",n=>n.id===d.id||ids.has(n.id)?1:0.1);
  lk.attr("opacity",e=>{const s=e.source.id||e.source,t=e.target.id||e.target;return s===d.id||t===d.id?0.8:0.03});
}).on("mousemove",ev=>{tt.style.left=(ev.clientX+16)+"px";tt.style.top=(ev.clientY-10)+"px"})
.on("mouseout",()=>{tt.style.opacity=0;nc.attr("opacity",1);nl.attr("opacity",1);lk.attr("opacity",null)});

sim.on("tick",()=>{

  nl.attr("x",d=>d.x).attr("y",d=>d.y);
});
