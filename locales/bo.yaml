    confirm_prompt: '⚠️ **གཏན་འབེབས་ /reload-mcp**


      MCP ཞབས་ཞུ་ཆས་རྣམས་བསྐྱར་སྒྲིག་བྱས་ན་ཐོག་ཐེངས་འདིའི་ལག་ཆའི་སྡེ་ཚན་བསྐྱར་སྒྲིག་བྱེད་ལ། **མཁོ་སྤྲོད་པའི་འདོན་གཞིའི་ཉར་ཚགས་ལ་མི་འཐུས་པ་བཟོ་ངེས།** — ཤུལ་མའི་འཕྲིན་གྱིས་ནང་འཁོད་ཧྲིལ་བོའི་ཊོ་ཁེན་རྣམས་ཡང་བསྐྱར་གཏོང་ངེས།  ཡིག་སྡེབ་རིང་པོ་འམ་བསམ་བློ་ཆེ་བའི་དཔེ་དབྱིབས་རྣམས་ལ་འདི་ནི་གླ་ཤོར་ཆེན་པོ་ཡིན་སྲིད།


      འདེམས་རོགས།

      • **ཐེངས་གཅིག་ཆོག་མཆན་སྤྲོད** — ད་ལྟ་བསྐྱར་སྒྲིག་བྱོས།

      • **རྟག་ཏུ་ཆོག་མཆན་སྤྲོད** — ད་ལྟ་བསྐྱར་སྒྲིག་བྱས་ནས་འདི་འདྲའི་འདོན་གཞི་རྟག་ཏུ་མི་སྟོན་པར་བཟོ།

      • **བཤོལ།** — MCP ལག་ཆ་རྣམས་མ་འགྱུར་བར་བཞག


