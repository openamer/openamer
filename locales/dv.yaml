      2. ތިބާގެ ބޮޓު ނަގާ.

      3. Bot Settings → Threads Settings ހުޅުވާ.

      4. Threaded Mode ޖައްސާ އަދި ޔޫޒަރުންނަށް އައު ތްރެޑް އުފެއްދުމުގެ ހުއްދަ ދީފައިވާކަން ކަށަވަރުކުރާ.


      ދެން /topic އަލުން ފޮނުވާ.'
