    always_followup: 'ℹ️ އިތުރަށް އަންނަ `/reload-mcp` ކޯލްތައް ކޮންފަރމޭޝަނުން ނުވެ ރަންވާނެ. config.yaml ގައި `approvals.mcp_reload_confirm: true` މެދުން އަލުން އެނެބަލްކުރޭ.'
    confirm_prompt: '⚠️ **/reload-mcp ކޮންފަރމްކުރޭ**


      MCP ސަރވަރތައް ރީލޯޑްކުރުމުން މި ސެޝަނަށް ޓޫލް ސެޓް އަލުން ބިލްޑްވާނެ، އަދި **ޕްރޮވައިޑަރ ޕްރޮމްޕްޓް ކެޝް އިންވެލިޑްވާނެ** — ދެން އަންނަ މެސެޖުން ފުރިހަމަ އިންޕުޓް ޓޯކަންތައް އަލުން ފޮނުވާނެ. ދިގު ކޮންޓެކްސްޓް ނުވަތަ މަތި ރިޒަނިންގ މޮޑެލްތަކުގައި މިއީ ބޮޑު ޚަރަދަކަށް ވެދާނެ.


      އިޚްތިޔާރުކުރޭ:

      • **އެއްފަހަރު އެޕްރޫވް** — މިހާރު ރީލޯޑްކުރޭ

      • **ހަމައެކަން އެޕްރޫވް** — މިހާރު ރީލޯޑްކުރޭ އަދި މި ޕްރޮމްޕްޓް ދާއިމީގޮތުން ނިއްވާ

      • **ކެންސަލް** — MCP ޓޫލްތައް ބަދަލެއްނުވެ ބަހައްޓާ


      _ޓެކްސްޓް ފޯލްބެކް: `/approve`، `/always`، ނުވަތަ `/cancel` އަށް ޖަވާބުދޭ._'
