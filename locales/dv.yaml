    restore_needs_topic: ސެޝަނެއް ރިސްޓޯކުރުމަށް، ފުރަތަމަ Telegram ޓޮޕިކެއް އުފައްދާ ނުވަތަ ހުޅުވާ، ދެން އެ ޓޮޕިކުގެ ތެރޭގައި /topic <session-id> ފޮނުވާ. އައު ޓޮޕިކެއް އުފެއްދުމަށް، All Messages ހުޅުވާ އެތަނަށް ކޮންމެ މެސެޖެއް ފޮނުވާ.
