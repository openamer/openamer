    cancelled: 🟡 /reload-mcp ரத்து செய்யப்பட்டது. MCP கருவிகள் மாற்றப்படவில்லை.
    always_followup: 'ℹ️ எதிர்கால `/reload-mcp` அழைப்புகள் உறுதிப்படுத்தல் இல்லாமல் இயங்கும். config.yaml-இல் `approvals.mcp_reload_confirm: true` மூலம் மீண்டும் இயக்கு.'
    confirm_prompt: '⚠️ **/reload-mcp ஐ உறுதிப்படுத்து**


      MCP சேவையகங்களை மீண்டும் ஏற்றுவது இந்த அமர்வுக்கான கருவித் தொகுப்பை மீண்டும் கட்டமைக்கும் மற்றும் **வழங்குநர் ப்ராம்ப்ட் கேஷை செல்லாததாக்கும்** — அடுத்த செய்தி முழு உள்ளீட்டு டோக்கன்களையும் மீண்டும் அனுப்பும்.  நீண்ட-சூழல் அல்லது அதிக-பகுத்தறிவு மாதிரிகளில் இது விலை உயர்ந்ததாக இருக்கலாம்.


      தேர்ந்தெடு:

      • **ஒருமுறை அனுமதி** — இப்போது மீண்டும் ஏற்று

      • **எப்போதும் அனுமதி** — இப்போது மீண்டும் ஏற்றி இந்த அறிவிப்பை நிரந்தரமாக அமைதிப்படுத்து

      • **ரத்து** — MCP கருவிகளை மாற்றமின்றி விடு


      _உரை மாற்றுவழி: `/approve`, `/always`, அல்லது `/cancel` என பதிலளி._'
