  voice:
    enabled_voice_only: 'குரல் பயன்முறை இயக்கப்பட்டது.

      நீங்கள் குரல் செய்திகளை அனுப்பும்போது நான் குரலில் பதிலளிப்பேன்.

      அனைத்து செய்திகளுக்கும் குரல் பதில்களைப் பெற /voice tts பயன்படுத்தவும்.'
    disabled_text: குரல் பயன்முறை முடக்கப்பட்டது. உரை மட்டும் பதில்கள்.
    tts_enabled: 'தானியங்கி TTS இயக்கப்பட்டது.

      எல்லா பதில்களிலும் ஒரு குரல் செய்தி இருக்கும்.'
    status_mode: 'குரல் பயன்முறை: {label}'
    status_channel: 'குரல் சேனல்: #{channel}'
    status_participants: 'பங்கேற்பாளர்கள்: {count}'
    status_member: '  - {name}{status}'
    speaking: ' (பேசுகிறார்)'
    enabled_short: குரல் பயன்முறை இயக்கப்பட்டது.
    disabled_short: குரல் பயன்முறை முடக்கப்பட்டது.
    label_off: முடக்கு (உரை மட்டும்)
    label_voice_only: இயக்கு (குரல் செய்திகளுக்கு குரல் பதில்)
    label_all: TTS (அனைத்து செய்திகளுக்கும் குரல் பதில்)
    help: '{toggle}


      **/voice எப்படி வேலை செய்கிறது**

      • `/voice on` — நீங்கள் குரல் செய்தி அனுப்பும்போது குரல் பதில்

      • `/voice tts` — *ஒவ்வொரு* செய்திக்கும் குரல் பதில்

      • `/voice off` — உரை-மட்டும் பதில்களுக்குத் திரும்பு

      • `/voice status` — தற்போதைய பயன்முறையைக் காட்டு

      • `/voice` (வாதம் இல்லாமல்) — இயக்கம் மற்றும் முடக்கத்திற்கு இடையே விரைவு மாற்று{channels}'
    help_channels: '


      **நேரடி குரல் சேனல்கள் (Discord)**

      • முதலில் ஒரு குரல் சேனலில் சேரவும், பின்னர் `/voice channel` — நான் சேர்ந்து, கேட்டு, எனது பதில்களைப் பேசுவேன்

      • `/voice leave` — குரல் சேனலிலிருந்து இணைப்பைத் துண்டி'
