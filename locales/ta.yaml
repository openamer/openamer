  verbose:
    not_enabled: "`/verbose` கட்டளை செய்தியிடல் தளங்களுக்கு இயக்கப்படவில்லை.\n\n`config.yaml` இல் இதை இயக்கவும்:\n```yaml\ndisplay:\n  tool_progress_command: true\n```"
    mode_off: '⚙️ கருவி முன்னேற்றம்: **OFF** — கருவி செயல்பாடு எதுவும் காட்டப்படவில்லை.'
    mode_new: '⚙️ கருவி முன்னேற்றம்: **NEW** — கருவி மாறும்போது காட்டப்படும் (முன்னோட்ட நீளம்: `display.tool_preview_length`, இயல்புநிலை 40).'
    mode_all: '⚙️ கருவி முன்னேற்றம்: **ALL** — ஒவ்வொரு கருவி அழைப்பும் காட்டப்படும் (முன்னோட்ட நீளம்: `display.tool_preview_length`, இயல்புநிலை 40).'
    mode_verbose: '⚙️ கருவி முன்னேற்றம்: **VERBOSE** — ஒவ்வொரு கருவி அழைப்பும் முழு அளவுருக்களுடன் காட்டப்படும்.'
