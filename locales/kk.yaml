      • `/voice status` — ағымдағы режимді көрсету

      • `/voice` (аргументсіз) — қосулы мен өшірулі арасында жылдам ауыстыру{channels}'
    help_channels: '


      **Тікелей дауыс арналары (Discord)**

      • Алдымен дауыс арнасына қосылыңыз, содан кейін `/voice channel` — мен қосылып, тыңдаймын және жауаптарымды дауыспен айтамын

      • `/voice leave` — дауыс арнасынан ажырау'
