      • **Fa’ati’a hō’ē taime** — fa’auta fa’ahou i teienei

      • **Fa’ati’a noa** — fa’auta fa’ahou i teienei e ’eiaha e fa’a’ite fa’ahou i teie anira’a

      • **Fa’aore** — vaiiho i te mau mauha’a MCP ma te taui ’ore


      _’Ei mono nā roto i te pāpa’ira’a: pāhono `/approve`, `/always`, ’aore rā `/cancel`._'
