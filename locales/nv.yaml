      • `/voice on` — azhí bee naʼídíkid yíníłtsą́ągo azhí bee yáłtiʼ

      • `/voice tts` — *tʼáá ałtso* naʼídíkidgi azhí bee yáłtiʼ

      • `/voice off` — bizaad tʼéiyá bee naʼídíkidjįʼ náʼádleeh

      • `/voice status` — kʼad hólónígíí bee hooʼánígíí bídiníłʼį́į́h

      • `/voice` (bizaad doo bee hólǫ́ǫ da) — hooʼá dóó doo hooʼá da bitaʼgi hazhóʼó łahgo ádíílííł{channels}'
    help_channels: '


      **Azhí bee yáłtiʼgi hólónígíí (Discord)**

      • Áłtsé azhí bee yáłtiʼgi hólónígíí yíníłtį́į́h, índa `/voice channel` — shí ałdóʼ yíshtį́į́h, yísíítsʼą́ą́ʼ, dóó azhí bee yáłtiʼgo shinaʼídíkid

      • `/voice leave` — azhí bee yáłtiʼgi hólónígíí bitsʼą́ąjįʼ nahjįʼ yíníłtį́į́h'
