    status_member: '  - {name}{status}'
    speaking: ' (ይዛረብ)'
    enabled_short: ኣገባብ ድምጺ ተኸፊቱ።
    disabled_short: ኣገባብ ድምጺ ተዓጽዩ።
    label_off: ጠፊኡ (ጽሑፍ ጥራይ)
    label_voice_only: ተኸፊቱ (ንመልእኽትታት ድምጺ ብድምጺ መልሲ)
    label_all: TTS (ንኹሉ መልእኽትታት ብድምጺ መልሲ)
    help: '{toggle}


      **/voice ከመይ ይሰርሕ**

      • `/voice on` — መልእኽቲ ድምጺ ምስ ትልእኽ ብድምጺ መልሲ

      • `/voice tts` — ን*ነፍሲ ወከፍ* መልእኽቲ ብድምጺ መልሲ

      • `/voice off` — ናብ ጽሑፍ ጥራይ መልስታት ተመለስ

      • `/voice status` — ህሉው ኣገባብ ኣርኢ

      • `/voice` (ብዘይ ተወሳኺ) — ብቕልጡፍ ኣብ መንጎ ተኸፊቱን ጠፊኡን ቀያይር{channels}'
    help_channels: '


      **ቀጥታዊ ቻነላት ድምጺ (Discord)**

      • መጀመርታ ናብ ቻነል ድምጺ ኣትው፣ ደሓር `/voice channel` — ኣነ ክኣቱ፣ ክሰምዕ፣ ንመልስታተይ ድማ ብድምጺ ክዛረብ

      • `/voice leave` — ካብ ቻነል ድምጺ ተለዓል'
