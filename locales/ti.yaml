  voice:
    enabled_voice_only: 'ኣገባብ ድምጺ ተኸፊቱ።

      ንስኻ ድምጺ መልእኽቲ ምስ ትሰድድ ብድምጺ ክምልስ።

      ንኹሉ መልእኽቲ ብድምጺ መልሲ ንምርካብ /voice tts ተጠቐም።'
