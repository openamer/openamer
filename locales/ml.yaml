      **/voice എങ്ങനെ പ്രവർത്തിക്കുന്നു**

      • `/voice on` — നിങ്ങൾ ഒരു വോയ്സ് സന്ദേശം അയയ്ക്കുമ്പോൾ വോയ്സ് മറുപടി

