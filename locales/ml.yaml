  reload_mcp:
    cancelled: 🟡 /reload-mcp റദ്ദാക്കി. MCP ടൂളുകൾ മാറ്റമില്ലാതെ തുടരുന്നു.
    always_followup: 'ℹ️ ഇനിയുള്ള `/reload-mcp` കോളുകൾ സ്ഥിരീകരണമില്ലാതെ പ്രവർത്തിക്കും. config.yaml എന്ന ഫയലിലെ `approvals.mcp_reload_confirm: true` വഴി വീണ്ടും പ്രവർത്തനക്ഷമമാക്കാം.'
    confirm_prompt: '⚠️ **/reload-mcp സ്ഥിരീകരിക്കുക**


      MCP സെർവറുകൾ വീണ്ടും ലോഡ് ചെയ്യുന്നത് ഈ സെഷനിലെ ടൂൾ സെറ്റ് പുനർനിർമ്മിക്കുകയും **പ്രൊവൈഡർ പ്രോംപ്റ്റ് കാഷെ അസാധുവാക്കുകയും** ചെയ്യും — അടുത്ത സന്ദേശം പൂർണ്ണ ഇൻപുട്ട് ടോക്കണുകൾ വീണ്ടും അയയ്ക്കും.  ദീർഘ-സന്ദർഭ അല്ലെങ്കിൽ ഉയർന്ന റീസണിംഗ് മോഡലുകളിൽ ഇത് ചെലവേറിയതായിരിക്കാം.


      തിരഞ്ഞെടുക്കുക:

      • **ഒരിക്കൽ അനുവദിക്കുക** — ഇപ്പോൾ വീണ്ടും ലോഡ് ചെയ്യുക

      • **എപ്പോഴും അനുവദിക്കുക** — ഇപ്പോൾ വീണ്ടും ലോഡ് ചെയ്ത് ഈ പ്രോംപ്റ്റ് ശാശ്വതമായി നിശ്ശബ്ദമാക്കുക

      • **റദ്ദാക്കുക** — MCP ടൂളുകൾ മാറ്റമില്ലാതെ വിടുക


      _ടെക്സ്റ്റ് ഫാൾബാക്ക്: `/approve`, `/always`, അല്ലെങ്കിൽ `/cancel` എന്ന് മറുപടി നൽകുക._'
