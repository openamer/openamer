    always_followup: 'ℹ️ భవిష్యత్ `/reload-mcp` కాల్స్ నిర్ధారణ లేకుండా అమలవుతాయి. config.yamlలో `approvals.mcp_reload_confirm: true` ద్వారా మళ్లీ ప్రారంభించండి.'
    confirm_prompt: '⚠️ **/reload-mcp నిర్ధారించండి**


      MCP సర్వర్లను రీలోడ్ చేయడం ఈ సెషన్ కోసం టూల్ సెట్‌ను పునర్నిర్మిస్తుంది మరియు **ప్రొవైడర్ ప్రాంప్ట్ క్యాష్‌ను ఇన్‌వాలిడేట్ చేస్తుంది** — తదుపరి సందేశం పూర్తి ఇన్‌పుట్ టోకెన్లను మళ్లీ పంపుతుంది.  పొడవైన-కాంటెక్స్ట్ లేదా అధిక-రీజనింగ్ మోడల్స్‌పై ఇది ఖర్చుతో కూడుకున్నది కావచ్చు.


      ఎంచుకోండి:

      • **ఒకసారి ఆమోదించండి** — ఇప్పుడే రీలోడ్ చేయండి

      • **ఎల్లప్పుడూ ఆమోదించండి** — ఇప్పుడే రీలోడ్ చేసి ఈ ప్రాంప్ట్‌ను శాశ్వతంగా నిశ్శబ్దం చేయండి

      • **రద్దు చేయండి** — MCP టూల్స్‌ను మార్చకుండా ఉంచండి


      _టెక్స్ట్ ఫాల్‌బ్యాక్: `/approve`, `/always`, లేదా `/cancel` అని ప్రత్యుత్తరం ఇవ్వండి._'
