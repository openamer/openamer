      MCP ସର୍ଭରଗୁଡ଼ିକ ପୁନଃ ଲୋଡ୍ କରିବା ଏହି ସେସନ୍ ପାଇଁ ଟୁଲ୍ ସେଟ୍ ପୁନଃ ନିର୍ମାଣ କରେ ଏବଂ **ପ୍ରୋଭାଇଡର୍ ପ୍ରମ୍ପ୍ଟ କ୍ୟାସକୁ ଅବୈଧ କରେ** — ପରବର୍ତ୍ତୀ ସନ୍ଦେଶ ସମ୍ପୂର୍ଣ୍ଣ ଇନପୁଟ୍ ଟୋକେନ୍ ପୁନଃ ପଠାଇବ।  ଲମ୍ବା-ପ୍ରସଙ୍ଗ କିମ୍ବା ଉଚ୍ଚ-ଯୁକ୍ତି ମଡେଲଗୁଡ଼ିକରେ ଏହା ମହଙ୍ଗା ହୋଇପାରେ।


      ଚୟନ କରନ୍ତୁ:

      • **ଥରେ ଅନୁମୋଦନ କରନ୍ତୁ** — ବର୍ତ୍ତମାନ ପୁନଃ ଲୋଡ୍ କରନ୍ତୁ

      • **ସର୍ବଦା ଅନୁମୋଦନ କରନ୍ତୁ** — ବର୍ତ୍ତମାନ ପୁନଃ ଲୋଡ୍ କରନ୍ତୁ ଏବଂ ଏହି ପ୍ରମ୍ପ୍ଟକୁ ସ୍ଥାୟୀ ଭାବରେ ନୀରବ କରନ୍ତୁ

      • **ବାତିଲ୍ କରନ୍ତୁ** — MCP ଟୁଲଗୁଡ଼ିକ ଅପରିବର୍ତ୍ତିତ ରଖନ୍ତୁ


      _ଟେକ୍ସଟ୍ ଫଲବ୍ୟାକ୍: `/approve`, `/always`, କିମ୍ବା `/cancel` ଉତ୍ତର ଦିଅନ୍ତୁ।_'
