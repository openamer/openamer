      Mo máa ń fi ohùn dáhùn nígbà tí o bá fi àwọn ìfiránṣẹ́ ohùn ránṣẹ́.

      Lo /voice tts láti gba àwọn ìdáhùn ohùn fún gbogbo àwọn ìfiránṣẹ́.'
    disabled_text: Ìpò ohùn ti pa. Àwọn ìdáhùn ọ̀rọ̀ nìkan.
    tts_enabled: 'Auto-TTS ti ṣí.

      Gbogbo àwọn ìdáhùn yóò ní ìfiránṣẹ́ ohùn.'
    status_mode: 'Ìpò ohùn: {label}'
    status_channel: 'Ìkanni ohùn: #{channel}'
    status_participants: 'Awọn olukopa: {count}'
    status_member: '  - {name}{status}'
    speaking: ' (ń sọ̀rọ̀)'
    enabled_short: Ipo ohùn ti ṣiṣẹ́.
    disabled_short: Ipo ohùn ti wa ni pipa.
    label_off: Pipa (ọ̀rọ̀ nìkan)
    label_voice_only: Tan (ìdáhùn ní ohùn sí àwọn ìfọ̀rọ̀wérọ̀ ohùn)
    label_all: TTS (ìdáhùn ní ohùn sí gbogbo àwọn ìfọ̀rọ̀wérọ̀)
    help: '{toggle}


      **Bá /voice ṣe ń ṣiṣẹ́**

      • `/voice on` — ìdáhùn ní ohùn nígbà tí o bá fi ìfọ̀rọ̀wérọ̀ ohùn ránṣẹ́

      • `/voice tts` — ìdáhùn ní ohùn sí *gbogbo* ìfọ̀rọ̀wérọ̀

      • `/voice off` — padà sí àwọn ìdáhùn ọ̀rọ̀-ìwé nìkan

      • `/voice status` — fi ipò tó wà lọ́wọ́lọ́wọ́ hàn

      • `/voice` (kò sí àríyànjiyàn) — yíyí padà kíákíá láàrin tan àti pa{channels}'
    help_channels: '


      **Àwọn ikanni ohùn tó ń ṣiṣẹ́ (Discord)**

      • Kọ́kọ́ darapọ̀ mọ́ ikanni ohùn kan, lẹ́yìn náà `/voice channel` — N ó darapọ̀, gbọ́, kí n sì sọ àwọn ìdáhùn mi

      • `/voice leave` — ya kúrò ní ikanni ohùn'
