    confirm_prompt: '⚠️ **/reload-mcp ངེས་སྒྲིག**


      MCP སར་བར་རྣམས་བསྐྱར་སྒོར་བྱེད་པས་ལས་ཚོགས་འདིའི་ལག་ཆའི་ཚོགས་བསྐྱར་བཟོ་བྱེད་ཅིང་ **ཕྲན་སྤྲོད་པའི་འདོད་ཚུལ་གྱི་གསོག་འཛིན་མི་ལེགས་པར་བཟོ** — ཤོག་འཕྲིན་རྗེས་མས་ཐོག་བསྐྱོད་ཀྱི་ཊོ་ཀེན་ཆ་ཚང་བསྐྱར་སྤྲོད་བྱེད་རྒྱུ་ཡིན།  བརྗོད་ཚིག་རིང་པོ་དང་བསམ་ཚུལ་མཐོ་བའི་དཔེ་རྣམས་ལ་འདི་འདྲ་གོང་ཆེན་དུ་འགྲོ་སྲིད།


      འདེམས:

      • **ཐེངས་གཅིག་ངེས་སྒྲིག** — ད་ལྟ་བསྐྱར་སྒོར

      • **རྟག་པར་ངེས་སྒྲིག** — ད་ལྟ་བསྐྱར་སྒོར་བྱེད་ཅིང་འདི་ངེས་སྒྲིག་རྟག་གཏན་དུ་སྒྲོག་མི་ཐོན

      • **བཤོལ** — MCP ལག་ཆ་མ་འགྱུར་བར་བཞག


      _ཡིག་ཐོག་ཚབ་ལུ་ལན་སྤྲོད: `/approve`, `/always`, ཡང་ན་ `/cancel`._'
