  reload_mcp:
    cancelled: 🟡 /reload-mcp ರದ್ದುಗೊಳಿಸಲಾಗಿದೆ. MCP ಉಪಕರಣಗಳು ಬದಲಾಗಿಲ್ಲ.
    always_followup: 'ℹ️ ಮುಂದಿನ `/reload-mcp` ಕರೆಗಳು ದೃಢೀಕರಣವಿಲ್ಲದೆ ಚಲಿಸುತ್ತವೆ. config.yaml ನಲ್ಲಿ `approvals.mcp_reload_confirm: true` ಮೂಲಕ ಮತ್ತೆ ಸಕ್ರಿಯಗೊಳಿಸಿ.'
    confirm_prompt: '⚠️ **/reload-mcp ಅನ್ನು ದೃಢೀಕರಿಸಿ**


      MCP ಸರ್ವರ್ಗಳನ್ನು ಮರುಲೋಡ್ ಮಾಡುವುದು ಈ ಸೆಷನ್ಗಾಗಿ ಉಪಕರಣ ಸೆಟ್ ಅನ್ನು ಮರುನಿರ್ಮಿಸುತ್ತದೆ ಮತ್ತು **ಪ್ರೊವೈಡರ್ ಪ್ರಾಂಪ್ಟ್ ಕ್ಯಾಶ್ ಅನ್ನು ಅಮಾನ್ಯಗೊಳಿಸುತ್ತದೆ** — ಮುಂದಿನ ಸಂದೇಶವು ಪೂರ್ಣ ಇನ್ಪುಟ್ ಟೋಕನ್ಗಳನ್ನು ಮರುಕಳುಹಿಸುತ್ತದೆ.  ದೀರ್ಘ-ಸಂದರ್ಭ ಅಥವಾ ಹೆಚ್ಚು-ತಾರ್ಕಿಕ ಮಾದರಿಗಳಲ್ಲಿ ಇದು ದುಬಾರಿಯಾಗಬಹುದು.


      ಆಯ್ಕೆಮಾಡಿ:

      • **ಒಮ್ಮೆ ಅನುಮೋದಿಸಿ** — ಈಗ ಮರುಲೋಡ್ ಮಾಡಿ

      • **ಯಾವಾಗಲೂ ಅನುಮೋದಿಸಿ** — ಈಗ ಮರುಲೋಡ್ ಮಾಡಿ ಮತ್ತು ಈ ಪ್ರಾಂಪ್ಟ್ ಅನ್ನು ಶಾಶ್ವತವಾಗಿ ಸದ್ದಿಲ್ಲದೆ ಮಾಡಿ

      • **ರದ್ದುಮಾಡಿ** — MCP ಉಪಕರಣಗಳನ್ನು ಬದಲಾಗದೆ ಬಿಡಿ


      _ಪಠ್ಯ ಪರ್ಯಾಯ: ಪ್ರತ್ಯುತ್ತರಿಸಿ `/approve`, `/always`, ಅಥವಾ `/cancel`._'
