    always_followup: 'ℹ️ ਭਵਿੱਖ ਦੀਆਂ `/reload-mcp` ਕਾਲਾਂ ਬਿਨਾਂ ਪੁਸ਼ਟੀ ਦੇ ਚੱਲਣਗੀਆਂ। config.yaml ਵਿੱਚ `approvals.mcp_reload_confirm: true` ਰਾਹੀਂ ਦੁਬਾਰਾ ਸਮਰੱਥ ਕਰੋ।'
