  reload_mcp:
    cancelled: 🟡 /reload-mcp ຖືກຍົກເລີກ. ເຄື່ອງມື MCP ບໍ່ປ່ຽນແປງ.
    always_followup: 'ℹ️ ການເອີ້ນ `/reload-mcp` ໃນອະນາຄົດຈະເຮັດວຽກໂດຍບໍ່ມີການຢືນຢັນ. ເປີດໃຊ້ຄືນຜ່ານ `approvals.mcp_reload_confirm: true` ໃນ config.yaml.'
    confirm_prompt: '⚠️ **ຢືນຢັນ /reload-mcp**


      ການໂຫຼດເຊີບເວີ MCP ຄືນໃໝ່ຈະສ້າງຊຸດເຄື່ອງມືຂອງເຊສຊັນນີ້ໃໝ່ ແລະ **ເຮັດໃຫ້ແຄຊພຣອມຕ໌ຂອງຜູ້ໃຫ້ບໍລິການໃຊ້ບໍ່ໄດ້** — ຂໍ້ຄວາມຕໍ່ໄປຈະສົ່ງໂທເຄັນອິນພຸດເຕັມທັງໝົດຄືນ. ສຳລັບມອເດລທີ່ມີບໍລິບົດຍາວ ຫຼື ມີການຄິດໄຕ່ຕອງສູງ ອາດມີຄ່າໃຊ້ຈ່າຍສູງ.


      ເລືອກ:

      • **ອະນຸມັດເທື່ອດຽວ** — ໂຫຼດຄືນຕອນນີ້

      • **ອະນຸມັດສະເໝີ** — ໂຫຼດຄືນຕອນນີ້ ແລະ ປິດການຖາມນີ້ຖາວອນ

      • **ຍົກເລີກ** — ປ່ອຍໃຫ້ເຄື່ອງມື MCP ບໍ່ປ່ຽນແປງ


      _ທາງເລືອກຂໍ້ຄວາມ: ຕອບ `/approve`, `/always`, ຫຼື `/cancel`._'
