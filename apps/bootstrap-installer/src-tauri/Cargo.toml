[package]
name = "openamer-bootstrap"
version = "0.0.1"
description = "OpenAmer Setup — signed installer that drives scripts/install.ps1"
authors = ["OpenAmer <info@openamer.com>"]
edition = "2021"
rust-version = "1.77"

# Rename the output binary so the distributed artifact is literally
# `OpenAmer-Setup.exe` on disk — not `openamer-bootstrap.exe`. Grandma sees
# what we hand her, period. Tauri honors [[bin]] over [package].name
# for the produced executable name.
[[bin]]
name = "OpenAmer-Setup"
path = "src/main.rs"

# The library target name MUST match the `withGlobalTauri` binding name that
# tauri.conf.json's `app.windows[].label` references. We don't ship a separate
# lib for now; everything is in src/.
[lib]
name = "openamer_bootstrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri runtime + plugins
#
# `custom-protocol` MUST stay enabled. Without it Tauri compiles in DEV mode
# (`tauri-2/src/lib.rs`: `!cfg!(feature = "custom-protocol")` selects the dev
# asset server) and the built binary serves the frontend from the Vite devUrl
# `http://127.0.0.1:5175` instead of the assets embedded in the binary. That
# dev server does not run on a user's machine, so the installer window opens
# WHITE/EMPTY — measured on this Windows host: the deployed
# `openamer-setup.exe` carried 0 embedded assets (`assets/` count 0, no
# `index-*.js`, no fonts) and the in-app update showed a blank window, while
# a rebuild with `--features tauri/custom-protocol` carried 66 `assets/`
# entries plus `index-*.js` and rendered the UI (ink coverage 19% vs. an
# empty window).
#
# The Tauri CLI passes this feature automatically for `tauri build`; a plain
# `cargo build --release` does NOT, which is exactly how the broken binary
# was produced. Declaring it as a default feature makes the correct build the
# ONLY possible one, so a manual `cargo build --release` can no longer ship
# an installer with a blank window.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

# Async + IO
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP — rustls so we don't need OpenSSL on the build box
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Logging — emitted to a file under OPENAMER_HOME/logs/ and (optionally) the
# webview console via Tauri's event channel.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Paths + utils
dirs = "5"
which = "6"
anyhow = "1"
thiserror = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

# Process control on Windows (CREATE_NO_WINDOW etc.)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# A 5-10MB signed installer is the goal. LTO + size-opt + single codegen unit.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
