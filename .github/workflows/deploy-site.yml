name: Deploy Site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      skills_index_run_id:
        description: 'Optional Build Skills Index run ID whose skills-index artifact should be deployed'
        required: false
        type: string
      rebuild_skills_index:
        description: 'Force a fresh multi-source crawl instead of reusing the latest healthy index'
        required: false
        default: false
        type: boolean
  # A finished index build feeds the deploy directly. Dispatching the deploy from
  # inside the crawl (the old trigger-deploy job) needed an API call from a
  # workflow whose own crawl had just spent the installation's hourly quota;
  # measured 2026-11-25: "HTTP 403: API rate limit exceeded for installation" in
  # trigger-deploy, every scheduled run. An event needs no quota.
  workflow_run:
    workflows: ["Build Skills Index"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-vercel:
    # Triggered automatically on release publish (production cuts) and
    # manually via `gh workflow run deploy-site.yml` when an out-of-band
    # main commit needs to ship live before the next release tag — e.g.
    # a skills-index PR that doesn't touch website/** paths and so
    # doesn't auto-deploy via the deploy-docs path.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger Vercel Deploy
        run: curl -fsS --retry 3 --retry-delay 10 -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

  deploy-docs:
    if: >-
      github.repository == 'openamer/openamer' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # The "Prepare skills index" step can fall back to a fresh crawl when no
    # healthy artifact or live index is available. That crawl measured 3900s
    # (65 min) end to end -- the ClawHub catalog walk alone is 3452s -- so the
    # old 30-minute budget could kill the deploy mid-crawl, and a 60-minute
    # one is not enough either. 180 minutes covers the crawl plus the
    # docusaurus build with headroom for a slower runner.
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install PyYAML for skill extraction
        uses: ./.github/actions/retry
        with:
          command: pip install pyyaml==6.0.2 httpx==0.28.1

      - name: Prepare skills index (unified multi-source catalog)
        env:
          # `gh run download` below needs Actions:read on THIS repository. The
          # App token does not carry it here, so the artifact download 403'd and
          # the step fell through to a fresh crawl that then hit the
          # installation rate limit (measured 2026-11-25). The workflow token
          # has actions:read from the permissions block above; the crawl keeps
          # the App token for its higher quota.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SKILLS_INDEX_RUN_ID: ${{ github.event.inputs.skills_index_run_id || github.event.workflow_run.id || '' }}
          REBUILD_SKILLS_INDEX: ${{ github.event.inputs.rebuild_skills_index || 'false' }}
        run: |
          # The unified external catalog is expensive to crawl and can burn
          # through the repository installation's GitHub API quota when several
          # docs deploys land close together.  Normal docs deploys therefore
          # reuse the latest healthy catalog: first the artifact from a
          # scheduled skills-index run, then the currently live index.  Only a
          # manual force rebuild does a fresh crawl here.
          #
          # If we do crawl, the build remains fatal. build_skills_index.py runs
          # the health check BEFORE writing and exits non-zero on source
          # collapse, keeping the last good Pages deployment live instead of
          # publishing a degenerate catalog.
          set -euo pipefail
          INDEX_PATH="website/static/api/skills-index.json"
          mkdir -p "$(dirname "$INDEX_PATH")"

          validate_index() {
            python3 - "$INDEX_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"invalid skills index JSON: {exc}", file=sys.stderr)
              sys.exit(1)
          skills = data.get("skills")
          if not isinstance(skills, list) or len(skills) < 1500:
              count = len(skills) if isinstance(skills, list) else "missing"
              print(f"skills index too small: {count}", file=sys.stderr)
              sys.exit(1)
          print(f"skills index ready: {len(skills)} skills")
          PY
          }

          if [ "$REBUILD_SKILLS_INDEX" = "true" ]; then
            python3 scripts/build_skills_index.py
            validate_index
            exit 0
          fi

          if [ -n "$SKILLS_INDEX_RUN_ID" ]; then
            tmpdir="$(mktemp -d)"
            echo "Downloading skills-index artifact from run $SKILLS_INDEX_RUN_ID"
            if gh run download "$SKILLS_INDEX_RUN_ID" --name skills-index --dir "$tmpdir"; then
              candidate="$(find "$tmpdir" -name skills-index.json -type f | head -n 1 || true)"
              if [ -n "$candidate" ]; then
                cp "$candidate" "$INDEX_PATH"
                if validate_index; then
                  exit 0
                fi
              fi
            fi
            echo "::warning::Could not use skills-index artifact from run $SKILLS_INDEX_RUN_ID; trying live index"
          fi

          echo "Downloading currently live skills index"
          if curl -fsSL --retry 3 --retry-delay 5 \
            "https://openamer.github.io/openamer/docs/api/skills-index.json" \
            -o "$INDEX_PATH" && validate_index; then
            exit 0
          fi

          echo "::warning::Live skills index unavailable or unhealthy; falling back to a fresh crawl"
          rm -f "$INDEX_PATH"
          python3 scripts/build_skills_index.py
          validate_index

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci
          working-directory: website

      - name: Build Docusaurus
        env:
          # GitHub Pages caps a published site at 1 GB. Measured 2026-11-25 on a
          # local build: one locale is 130 MB (52 MB user-guide incl. screenshots,
          # 38 MB JS/CSS chunks, 15 MB search index, 15 MB img), so the full 14
          # locales land near 1.8 GB and the artifact has to be ~1 GB zipped —
          # which is why step 14 fails with "Fetching artifact metadata failed".
          # Measured 2026-11-25: every locale dir under website/i18n is a 8-12 KB
          # stub (config only) except zh-Hans, which is 5.1 MB of real
          # translation. Building all 14 therefore duplicates the English site
          # 13 times with zero translated content - that is the 1.8 GB.
          # Build the locales that actually have content; add each new one here
          # as its i18n/<locale> tree grows, and the budget stays honest.
          DOCUSAURUS_LOCALES: en,zh-Hans
        run: npm run build
        working-directory: website

      - name: Stage deployment
        run: |
          # Two trees, one site. The marketing pages live in the repository's
          # `docs/` directory (that is what carries the CNAME), and the built
          # Docusaurus output is served under /docs/ because its baseUrl is
          # /docs/. Staging only the second tree produced an artifact with no
          # root page, so publishing it would have turned openamer.com/ into a
          # 404 while fixing openamer.com/docs/.
          mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/docs
          cp -R website/build/. _site/docs/
          # llms.txt / llms-full.txt are also published at the site root
          # (https://github.com/openamer/openamer/llms.txt) because some
          # agents and IDE plugins probe the classic root-level path rather
          # than /docs/llms.txt. Same file, two URLs, one source of truth.
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi
          # A staged site without a root page is the failure this step exists to
          # prevent, so fail here rather than on the CDN.
          test -f _site/index.html
          test -f _site/docs/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Wait for the Pages artifact to be visible
        # deploy-pages lists this run's artifacts and can see an empty list for
        # a few seconds after upload-pages-artifact returned (measured
        # 2026-11-25, run 45702845227: upload "Final size is 139257634 bytes",
        # 0.5 s later "Found 0 artifact(s)"). The artifact existed; the API had
        # not listed it yet. Poll until it is visible, then deploy.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -qx github-pages; then
              echo "github-pages visible after $i attempt(s)"
              exit 0
            fi
            sleep 4
          done
          echo "::error::the github-pages artifact never became visible to the artifacts API"
          exit 1

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
