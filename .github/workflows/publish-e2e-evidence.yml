name: Publish E2E evidence

# This runs only from the default branch after CI completes. It intentionally
# checks out main, never the PR ref, and treats the downloaded artifact as
# untrusted input before uploading validated GitHub attachments.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: publish-e2e-evidence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish inline E2E evidence
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gh-image
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # gh-image cannot run on the Actions GITHUB_TOKEN: GitHub rejects that
      # token for attachments, so `gh image` needs a user/bot session token --
      # an environment secret on `gh-image`, per gh-image's own CI/CD docs.
      # When that secret is absent the upload is not merely broken, the feature
      # was never enabled. Say so once and skip, instead of reding this run on
      # every CI completion for a reason that appears in no one's diff.
      - name: Check for a gh-image session token
        id: session-token
        env:
          GH_SESSION_TOKEN: ${{ secrets.GH_IMAGE_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${GH_SESSION_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No gh-image session token is configured (environment secret GH_IMAGE_SESSION_TOKEN on the 'gh-image' environment); skipping inline E2E evidence."
          {
            echo "### Inline E2E evidence skipped"
            echo ""
            echo "No \`gh-image\` session token is configured, so evidence images"
            echo "cannot be uploaded: GitHub rejects the Actions token for attachments."
            echo ""
            echo "Set \`GH_IMAGE_SESSION_TOKEN\` as an **environment secret** on the"
            echo "\`gh-image\` environment to enable this feature."
          } >> "$GITHUB_STEP_SUMMARY"

      # v1.2.0 resolves to 44f4b93ecbbe22de6c45fa2f62f519aee564ca8c.
      - name: Install gh-image
        if: steps.session-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install drogers0/gh-image --pin v1.2.0

      - name: Download and attach evidence
        if: steps.session-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_SESSION_TOKEN: ${{ secrets.GH_IMAGE_SESSION_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with CI run $SOURCE_RUN_ID."
            exit 0
          fi

          ARTIFACT_NAME=$(gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("e2e-evidence-"))) | .name' \
            | python3 -c 'import sys; print(next(iter(sys.stdin), "").strip())')
          if [ -z "$ARTIFACT_NAME" ]; then
            echo "No E2E evidence artifact was produced for CI run $SOURCE_RUN_ID."
            exit 0
          fi

          EVIDENCE_DIR="$RUNNER_TEMP/e2e-evidence"
          mkdir -p "$EVIDENCE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_REPO" --name "$ARTIFACT_NAME" --dir "$EVIDENCE_DIR"

          python3 scripts/ci/publish_e2e_evidence.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --source-repo "$SOURCE_REPO" \
            --pr-number "$PR_NUMBER"
