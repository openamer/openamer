name: Build Skills Index

on:
  schedule:
    # Run twice daily: 6 AM and 6 PM UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch: # Manual trigger
  push:
    branches: [main]
    paths:
      - "scripts/build_skills_index.py"
      - ".github/workflows/skills-index.yml"

permissions:
  contents: read
  actions: write # to trigger deploy-site.yml on schedule

jobs:
  build-index:
    # Only run on the upstream repository, not on forks
    if: github.repository == 'openamer/openamer'
    runs-on: ubuntu-latest
    # The crawl is dominated by the ClawHub catalog walk. The API offers
    # cursor pagination only (no offset), and a full run measured 8.16s per
    # page at 197 items per page -- so the 80,829-skill catalog is 411 pages
    # and 3452s (57.5 min) of walking alone. Adding the skills.sh path
    # resolution (446s) the whole build took 3900s = 65 minutes.
    #
    # The old 15-minute budget killed every scheduled run (they all ended
    # "cancelled" after 15m01s and the index was never published). 60 minutes
    # is still not enough: the measured build needs 65. On a GitHub-hosted
    # runner the same crawl is slower than on this laptop, so 180 minutes
    # covers the measurement with real headroom.
    timeout-minutes: 180
    environment: trusted-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pip install httpx==0.28.1 pyyaml==6.0.2

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/build_skills_index.py

      - name: Upload index artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7

  # Re-trigger the docs deploy so the refreshed index lands on the live site.
  # The deploy itself is owned by deploy-site.yml (which crawls and deploys
  # everything in one pipeline); we just kick it on a schedule.
  trigger-deploy:
    needs: build-index
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: trusted-automation
    steps:
      # Same reason as above: `uses: ./...` needs the repo in the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Trigger Deploy Site workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run deploy-site.yml --repo ${{ github.repository }} -f skills_index_run_id=${{ github.run_id }}
