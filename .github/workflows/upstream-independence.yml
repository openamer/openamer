name: Upstream independence

# Guards the claim that OpenAmer is its own implementation, not a rebranded
# fork. The claim is only worth something if it is enforced, so the two
# checks that do not need a local upstream checkout run here as blocking
# gates:
#
#   1. No runtime coupling. No OpenAmer module may import an upstream module
#      name, and nothing may reach out to the upstream repository. Files that
#      reference upstream deliberately (attribution docstrings, the audit
#      tooling itself) must be declared in scripts/port_from_upstream.py.
#
#   2. No unattributed upstream names. The shipped tree may not contain a
#      stray upstream identifier outside a declared attribution site.
#
# The line-level divergence audit needs a local upstream checkout, so it is
# not part of this workflow. Run it locally:
#
#   python scripts/audit_upstream_independence.py --upstream <path>
#   python scripts/audit_upstream_independence_desktop.py --upstream <path>

on:
  workflow_call:
    inputs:
      event_name:
        description: The event name from the calling orchestrator (pull_request or push).
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: upstream-independence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independence:
    name: upstream independence (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check for runtime upstream coupling
        # Exit code 1 when a module imports an upstream module name or the
        # tree reaches out to the upstream repository.
        run: python scripts/audit_upstream_coupling.py --fail-on-findings

      - name: Check for unattributed upstream names
        # Exit code 1 when an upstream identifier survives in the shipped
        # tree outside a declared attribution site.
        run: python scripts/port_from_upstream.py --check-only

      - name: Check the provenance markers
        # Every file the audit proved shared with upstream must still carry
        # its Upstream-Derived marker, and NOTICE must list the Python-side
        # derived files.
        run: |
          python -m pytest tests/openamer_cli/test_upstream_provenance.py \
            tests/scripts/test_upstream_independence_audit.py -q
