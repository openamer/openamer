name: Daily Release

# Publish a new OpenAmer release every day with a compact calendar tag (vYYMMDD),
# e.g. 2026-08-16 -> v260816. The version number (openamer_cli/__init__.py,
# pyproject.toml, apps/desktop/package.json) is bumped to today's date, then a
# git tag + GitHub Release are created. A second job builds the Windows NSIS
# installer and attaches it to the release, so every daily release ships a
# real, installable artifact (not an empty tag).
#
# `openamer update` on every install picks up the refreshed version the next
# time it runs.

on:
  schedule:
    # 00:30 UTC daily — runs a fresh release every calendar day.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # The version bump can no longer be pushed to main (protected: changes must
  # arrive through a PR), so the release job opens a PR and tries to merge it.
  # Without this scope `gh pr create` fails and the release never happens.
  pull-requests: write

jobs:
  daily-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep the ambient GITHUB_TOKEN so daily-release.py's `git push`
          # (version bump commit + release tag) is authenticated.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "openamer-bot"
          git config user.email "actions@github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run daily release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/daily-release.py --publish
          # Emit the tag for the downstream installer job. daily-release.py
          # is idempotent (no-op if today's tag already exists), so compute
          # the tag the same way it does.
          TAG="v$(date -u +%y%m%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: daily-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the installer from the commit the release job just tagged,
          # not from the trigger-time main.  Without this the checkout resolves
          # to github.sha (main as of the 00:30 UTC trigger), i.e. BEFORE the
          # version bump + tag exist - so every daily EXE ships one release
          # behind and never carries the same day's fixes.
          # Scheduled runs build the tag the release job just created, so the
          # artifact always belongs to its release.  A manual dispatch
          # (hotfix rebuild) builds the dispatched commit instead -- otherwise
          # re-running on the same day would rebuild the OLD tag and publish
          # an EXE older than the one already attached.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.daily-release.outputs.tag || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npm run dist:win:nsis
        env:
          # electron-builder resolves the electron binary from the workspace
          # root node_modules; the postinstall already downloaded it.
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path apps/desktop/release -Filter "OpenAmer-*-win-x64.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "No installer built"; exit 1 }
          $tag = "${{ needs.daily-release.outputs.tag }}"
          $repo = "${{ github.repository }}"
          # Measured 2026-11-18: this step failed with "release not found" against a
          # published release that the REST API resolved fine (id 450165465) and that
          # an owner token could upload to minutes later. Retry a bounded number of
          # times - and print the release gh actually sees on failure, so the next
          # occurrence names its own cause instead of just dead-ending.
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            gh release upload $tag "$($exe.FullName)" --repo $repo --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "upload attempt $i for $tag failed; what gh sees:"
            gh release view $tag --repo $repo --json tagName,isDraft,assets 2>&1 | Out-Host
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { Write-Error "Could not upload $($exe.Name) to $tag after 3 attempts"; exit 1 }

          # Stable download alias. Every docs page (en + 12 translated landing
          # pages) links to
          #   https://github.com/openamer/openamer/releases/latest/download/OpenAmer-Setup.exe
          # which only resolves while each release carries that exact asset name.
          # The versioned name changes every day, so publish the same installer a
          # second time under the stable name; the docs link then survives every
          # release instead of 404ing the day after it was written.
          $alias = Join-Path $exe.DirectoryName "OpenAmer-Setup.exe"
          Copy-Item $exe.FullName $alias -Force
          # Same bounded retry as the versioned asset: this one upload carries every
          # download link we publish, so a single "release not found" here breaks the
          # site while the release itself looks fine.
          $aliasOk = $false
          for ($i = 1; $i -le 3; $i++) {
            gh release upload $tag "$alias" --repo $repo --clobber
            if ($LASTEXITCODE -eq 0) { $aliasOk = $true; break }
            Write-Warning "alias upload attempt $i for $tag failed; what gh sees:"
            gh release view $tag --repo $repo --json tagName,isDraft,assets 2>&1 | Out-Host
            Start-Sleep -Seconds 15
          }
          if (-not $aliasOk) { Write-Error "Could not upload the stable alias OpenAmer-Setup.exe to $tag after 3 attempts"; exit 1 }

  setup-window:
    # The setup/update window is its own small Tauri binary (8-9 MB). It used to
    # live only on whatever machine happened to build it, so a release never
    # carried the screen people actually see first. Built here from the same tag
    # and attached next to the app installer.
    needs: daily-release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.daily-release.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        # apps/bootstrap-installer is a workspace member (apps/*) with no lockfile
        # of its own, so its deps come from the root lockfile.
        run: npm ci

      - name: Build the setup window
        working-directory: apps/bootstrap-installer
        run: |
          npm run build
          cd src-tauri
          cargo build --release --features tauri/custom-protocol

      - name: Upload setup window to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "apps/bootstrap-installer/src-tauri/target/release/OpenAmer-Setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "No setup window built"; exit 1 }
          $tag = "${{ needs.daily-release.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $name = "OpenAmer-Setup-$($tag.TrimStart('v'))-win-x64.exe"
          Copy-Item $exe $name
          # Same guard as the installer upload: never let one "release not found"
          # turn a built setup window into a missing release asset.
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            gh release upload $tag $name --repo $repo --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "upload attempt $i for $tag failed; what gh sees:"
            gh release view $tag --repo $repo --json tagName,isDraft,assets 2>&1 | Out-Host
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { Write-Error "Could not upload $name to $tag after 3 attempts"; exit 1 }
