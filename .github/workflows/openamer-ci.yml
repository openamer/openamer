# OpenAmer CI Assistant — lightweight self-check.
#
# This workflow used to `uses: openamer/openamer@v1` three times. That repo is
# not a GitHub Action (no action.yml at its root) and no `v1` tag exists, so
# every run died in "Set up job" after ~7s with
#   Unable to resolve action `openamer/openamer@v1`, unable to find version `v1`
# — red on every push and on the daily schedule, running no code at all.
#
# It now does the small, real self-check its name promises, using tooling the
# repo already depends on. The heavyweight suites live in ci.yml (pytest slices,
# lints, JS/TS, desktop E2E) and are not duplicated here.

name: OpenAmer CI Assistant

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily health check

permissions:
  contents: read

jobs:
  openamer-assist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m compileall -q openamer_cli cron gateway tools scripts
          echo "compileall - OK"

      - name: Byte-compile the cron layer
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('cron').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  bad.append(f"{p}:{e.lineno}: {e.msg}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("cron AST - OK")
          PY

      - name: Summary
        run: |
          echo "OpenAmer CI Assistant - self-check complete"
