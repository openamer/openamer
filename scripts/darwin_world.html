<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARWIN — Evolution</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#030508;font-family:'Inter','Segoe UI',sans-serif}
#hud{position:fixed;top:20px;left:20px;z-index:10;background:rgba(6,10,14,.7);backdrop-filter:blur(24px);border:1px solid rgba(126,231,135,.12);border-radius:16px;padding:18px 22px;min-width:250px}
#hud h2{font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:#7ee787;margin-bottom:10px;font-weight:600}
.st{display:flex;justify-content:space-between;font-size:.8rem;color:#8b949e;padding:3px 0}
.st b{color:#79c0ff;font-weight:600}
#feed{position:fixed;top:20px;right:20px;z-index:10;width:280px;background:rgba(8,12,16,.7);backdrop-filter:blur(20px);border:1px solid rgba(126,231,135,.1);border-radius:16px;padding:14px 18px;max-height:240px;overflow-y:auto}
#feed h3{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:#3d4650;margin-bottom:6px}
#feed .f{padding:3px 0;font-size:.72rem;color:#6e7a86;border-bottom:1px solid rgba(48,54,61,.3)}
#legend{position:fixed;bottom:20px;left:20px;z-index:10;color:#48525c;font-size:.7rem;background:rgba(8,12,16,.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 16px}
.ld{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 5px 0 10px;vertical-align:middle}
#card{position:fixed;bottom:24px;right:24px;z-index:30;width:310px;background:rgba(10,14,20,.88);backdrop-filter:blur(30px);border:1px solid rgba(126,231,135,.15);border-radius:24px;padding:24px;color:#c9d1d9;display:none;box-shadow:0 16px 48px rgba(0,0,0,.8)}
#card .em{font-size:2.6rem;float:right;margin-top:-4px}
#card .nm{font-size:1.25rem;font-weight:600;color:#7ee787}
#card .md{font-size:.72rem;color:#48525c;margin:2px 0 12px}
#card .bio{font-size:.8rem;line-height:1.65;color:#8b949e;margin:10px 0;padding:12px;background:rgba(126,231,135,.03);border-radius:10px;border-left:2px solid rgba(126,231,135,.3)}
#card .tr{display:inline-block;background:rgba(121,192,255,.06);border:1px solid rgba(121,192,255,.12);border-radius:16px;padding:3px 12px;font-size:.68rem;margin:3px 2px;color:#79c0ff;text-transform:capitalize}
#card .cl{position:absolute;top:12px;right:16px;cursor:pointer;color:#48525c;font-size:1rem}
.br{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:.7rem;color:#484f58;text-transform:uppercase;letter-spacing:.8px}
.bw{flex:1;height:5px;background:#0d1117;border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.3,1)}
#card .rec{font-size:.72rem;color:#484f58;margin-top:10px;letter-spacing:.5px}
.name-label{position:fixed;pointer-events:none;z-index:5;transform:translate(-50%,-130%);white-space:nowrap;font-size:.72rem;font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.name-label .nm{font-weight:600}
.name-label .em{font-size:1rem;margin-right:3px}
</style>
</head>
<body>
<div id="hud"><h2>🧬 DARWIN — Living Civilization</h2>
<div class="st"><span>Population</span><b id="s-p">–</b></div>
<div class="st"><span>Workers</span><b id="s-w">–</b></div>
<div class="stat"><span>Species</span><b id="s-sp">–</b></div>
<div class="stat"><span>Energy Pool</span><b id="s-e">–</b></div>
</div>
<div id="feed" style="position:fixed;top:20px;right:20px;z-index:10;width:280px;background:rgba(8,12,16,.7);backdrop-filter:blur(20px);border:1px solid rgba(126,231,135,.1);border-radius:18px;padding:14px 18px;max-height:220px;overflow-y:auto"><h3 style="font-size:.6rem;letter-spacing:1.5px;color:#3d4854;margin-bottom:6px">CHRONICLE — LIVE</h3></div>
<div id="card" style="display:none;position:fixed;bottom:24px;right:24px;z-index:20;width:300px;background:rgba(10,14,20,.88);backdrop-filter:blur(24px);border:1px solid rgba(126,231,135,.15);border-radius:20px;padding:22px;color:#c9d1d9;box-shadow:0 16px 48px rgba(0,0,0,.8)">
<span onclick="this.parentElement.style.display='none'" style="position:absolute;top:10px;right:14px;cursor:pointer;color:#485258;font-size:1rem">✕</span>
<div style="font-size:2.4rem;float:right;margin-top:-4px" id="ce">🙂</div>
<div style="font-size:1.25rem;font-weight:600;color:#7ee787" id="c-n">–</div>
<div style="font-size:.7rem;color:#484f58;margin:2px 0 10px" id="c-m">–</div>
<div style="font-size:.8rem;line-height:1.65;color:#8b949e;margin:10px 0;padding:10px;background:rgba(126,231,135,.03);border-radius:10px" id="c-b">–</div>
<div style="margin:10px 0" id="c-t"></div>
<div style="margin-top:8px">
<div style="display:flex;align-items:center;gap:10px;font-size:.65rem;color:#484f58;margin:4px 0"><span style="width:50px">FITNESS</span><div style="flex:1;height:5px;background:#0d1117;border-radius:3px;overflow:hidden"><div id="c-f" style="height:100%;background:linear-gradient(90deg,#1a7f4b,#7ee787);border-radius:3px;transition:width .8s"></div></div><span id="c-fv" style="width:35px;text-align:right">–</span></div>
<div style="display:flex;align-items:center;gap:10px;font-size:.68rem;color:#484f58;margin:6px 0">
<span style="width:50px">ENERGY</span><div style="flex:1;height:5px;background:#0d1117;border-radius:3px"><div id="c-e" style="height:100%;background:linear-gradient(90deg,#883e1f,#f0883e);border-radius:3px;transition:width .8s"></div></div><span id="c-ev2" style="width:35px;text-align:right">–</span></div>
</div>
<div style="font-size:.7rem;color:#484f58;margin-top:8px" id="c-r">–</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
// ── SCENE SETUP ───────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030508, .009);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setClearColor(0x020406);
document.body.appendChild(renderer.domElement);

// lights
scene.add(new THREE.AmbientLight(0x1a2a3a, 2.5));
const kl = new THREE.DirectionalLight(0x7ee787, 2.5); kl.position.set(15, 45, 10); scene.add(kl);
const fl = new THREE.DirectionalLight(0x79c0ff, .5); fl.position.set(-25, 20, -15); scene.add(fl);
const rl = new THREE.DirectionalLight(0xd2a8ff, 1.5); rl.position.set(0, 8, -30); scene.add(rl);
const pl = new THREE.PointLight(0x7ee787, 3, 60); pl.position.set(0, 6, 0); scene.add(pl);

// floor: dark reflective disc
const floor = new THREE.Mesh(new THREE.CircleGeometry(50, 64),
  new THREE.MeshStandardMaterial({color:0x06080c, metalness:.88, roughness:.35}));
floor.rotation.x = -Math.PI/2; scene.add(floor);
scene.add(new THREE.PolarGridHelper(34, 12, 6, 64, 0x1a4a28, 0x0a1f12));

// evolution core: pulsing sphere with wireframe shell
const core = new THREE.Mesh(new THREE.SphereGeometry(1.3, 32, 32),
  new THREE.MeshStandardMaterial({color:0x7ee787, emissive:0x7ee787, emissiveIntensity:3}));
core.position.y = 5; scene.add(core);
const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(2.6, 1),
  new THREE.MeshBasicMaterial({color:0x7ee787, wireframe:true, transparent:true, opacity:.1}));
core.add(shell);

// orbit rings
const ring1 = new THREE.Mesh(new THREE.TorusGeometry(16, .015, 8, 100),
  new THREE.MeshBasicMaterial({color:0x7ee787, transparent:true, opacity:.08}));
ring1.rotation.x = Math.PI/2; scene.add(ring1);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(24, .01, 8, 100),
  new THREE.MeshBasicMaterial({color:0x79c0ff, transparent:true, opacity:.05}));
ring2.rotation.x = Math.PI/2; scene.add(ring2);

// starfield
const sg = new THREE.BufferGeometry(); const sp = [];
for(let i=0;i<400;i++){const r=100+Math.random()*60, a=Math.random()*6.28, b=Math.random()*3.14;
  sp.push(r*Math.sin(ph)*Math.cos(a), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(t2=t2||0));}
sg.setAttribute('position', new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0x8899bb, size:.5, transparent:true, opacity:.4})));

// camera orbit
let mx=0, my=0, mD=false, th=.7, ph2=1.08, cd=52, auto=true;
let lx=0, ly=0;
addEventListener('mousemove', e=>{ if(mD){ th += (e.clientX-mx)*.004; ph2 -= (e.clientY-my)*.004; ph2 = Math.max(.3, Math.min(1.45, ph2)); } mx=e.clientX; my=e.clientY;});
addEventListener('mousedown', e=>{ if(e.target===renderer.domElement) mD=true; });
addEventListener('mouseup', ()=>mD=false);
addEventListener('wheel', e=>{ cd = Math.max(14, Math.min(120, cd + e.deltaY*.04)); });
function updCam(t){
  th += .0012; // slow auto-orbit
  camera.position.set(cd*Math.sin(ph2)*Math.cos(th), cd*Math.cos(ph2), cd*Math.sin(ph2)*Math.sin(th));
  camera.lookAt(0, 4, 0);
}

// ── state ────────────────────────────────────────────────────────────────────
const orgs = {}; const labels = {};
const ray = new THREE.Raycaster(); const mv = new THREE.Vector2();

function moodOf(f, e, w, l){
  if(f >= 25) return {m:'thriving', c:'#7ee787', e:'😄', curve:.8};
  if(e < 5) return {m:'dying', c:'#8b949e', e:'💀', curve:-.3};
  if(energy < 15) return {m:'hungry', m2:'hungry', e:'😟', curve:-.3};
  if(losses > wins && losses >= 2) return {m:'hurt', e:'😢', curve:-.5};
  if(age <= 0) return {m:'newborn', e:'👶', curve:.3};
  return {m:'healthy', e:'🙂', curve:.3};
}

function syncWorld(world){
  document.getElementById('s-p').textContent = world.stats.population;
  document.getElementById('s-work').textContent = world.stats.workers;
  document.getElementById('s-spec').textContent = world.stats.species_count;
  document.getElementById('s-tick').textContent = new Date().toLocaleTimeString();

  const seen = new Set();
  world.organisms.forEach(o=>{
    seen.add(o.id);
    const id = o.identity || {};
    let g = orgs[o.id];
    if(!g){
      g = new THREE.Group();
      const col = new THREE.Color((id.color||'#79c0ff').replace('#','0x'));
      const isW = o.type==='worker', isS = o.type==='species';
      let geo;
      if(isW) geo = new THREE.CapsuleGeometry(.55, 1.5, 4, 10);
      else if(isS) geo = new THREE.IcosahedronGeometry(.9, 0);
      else geo = new THREE.SphereGeometry(.5 + Math.min((o.fitness||0)/40, 1)*.7, 20, 20);
      const body = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({
        color: col, metalness: .3, roughness: .15,
        clearcoat: 1, clearcoatRoughness: .1,
        emissive: col.clone().multiplyScalar(.3)}));
      g.add(body);
      // FACE: eyes with iris, curved mouth
      const eps = id.face_params?.eye_spacing || .4;
      [-1,1].forEach(sd=>{
        const ew = new THREE.Mesh(new THREE.SphereGeometry(.15, 10, 10),
          new THREE.MeshBasicMaterial({color: 0xf0f4f8}));
        w.position.set(sd*fp.eye_spacing*.9, .3, .5); g.add(w);
        const ir = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 8),
          new THREE.MeshBasicMaterial({color: 0x79c0ff}));
        ir.position.set(sd*fp.eye_spacing*.9, .3, .58); g.add(ir);
        const pu = new THREE.Mesh(new THREE.SphereGeometry(.05, 6, 6),
          new THREE.MeshBasicMaterial({color: 0x000}));
        pu.position.set(sd*fp.eye_spacing*.9, .3, .64); g.add(pu);
      });
      // mouth: curved tube
      const mcurve = id.mood==='thriving'?.8:id.mood==='healthy'?.3:id.mood==='hungry'?-.3:id.mood==='hurt'?-.7:0;
      const mpath = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(-.22, -.1, .55),
        new THREE.Vector3(0, -.08 + mc*.2, .6),
        new THREE.Vector3(.2, -.08, .55));
      const mt = new THREE.Mesh(new THREE.TubeGeometry(mp2 = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(-.18, -.05, .55), new THREE.Vector3(0, -.05 + mc*.2, .6),
        new THREE.Vector3(.18, -.05, .55)), 8, .025, 6),
        new THREE.MeshBasicMaterial({color: 0x111820}));
      g.add(mt);
      g.position.set(o.x, .2, o.z);
      g.userData = {ty:o.y||2, id:o.id, ident:id, type:o.type,
        fitness:o.fitness, energy:o.energy, wins:o.wins, losses:o.losses,
        age:o.age_days, born:Date.now()%10000, spin:(Math.random()-.5)*.01,
        phase:Math.random()*6.28};
      S.add(g); orgs[g2=o.id]=g;
      const lb = document.createElement('div'); lb.className='nl';
      lb.innerHTML = `<span style="font-size:.95rem">${id.emoji||'🙂'}</span> <span style="color:${id.color};font-weight:600">${id.name||o.id}</span>`;
      document.body.appendChild(lb2 = lb); labels[o.id]=lb;
      // burst
      for(let k=0;k<8;k++){
        const bp = new THREE.Mesh(new THREE.SphereGeometry(.05,4,4),
          new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.9}));
        bp.position.set(o.x, o.y||2, o.z);
        scene.add(bp); bursts.push({m:bp, v:new THREE.Vector3(
          (Math.random()-.5)*.12, .12+Math.random()*.15, (Math.random()-.5)*.15)});
      }
    }
    g.userData.targetY = o.y||2;
  });
  Object.keys(orgs).forEach(id=>{
    if(!seen.has(id)){ orgs[id].userData.dying = true; }
  });
  world.events.slice(-4).forEach(e=>{
    logEv(`✦ ${e.kind}: ${e.parent?.slice(0,16)} → ${e.child?.slice(0,16)}`, '#f0883e');
  });
}

function logEv(text, color){
  const d = document.createElement('div');
  d.className='f'; d.style.color=color||'#c9d1d9'; d.textContent=text;
  feed.prepend(d);
  while(feed.children.length>16) feed.removeChild(feed.lastChild);
}
</script>
</body></html>
