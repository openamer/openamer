<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧬 Darwin World — Live Evolution</title>
<style>
  * { margin:0; padding:0; }
  body { overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }
  #hud { position:fixed; top:16px; left:16px; z-index:10; color:#7ee787;
         background:rgba(13,17,23,.85); border:1px solid #30363d;
         border-radius:10px; padding:14px 18px; min-width:230px; }
  #hud h1 { font-size:1rem; margin-bottom:6px; color:#7ee787; }
  .stat { display:flex; justify-content:space-between; gap:16px;
          font-size:.85rem; color:#c9d1d9; margin:2px 0; }
  .stat b { color:#79c0ff; }
  #legend { position:fixed; bottom:16px; left:16px; z-index:10;
            color:#8b949e; font-size:.78rem; background:rgba(13,17,23,.85);
            border:1px solid #30363d; border-radius:10px; padding:10px 14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%;
         margin-right:6px; vertical-align:middle; }
  #eventlog { position:fixed; top:16px; right:16px; z-index:10;
              color:#c9d1d9; font-size:.78rem; width:280px;
              background:rgba(13,17,23,.85); border:1px solid #30363d;
              border-radius:10px; padding:10px 14px; max-height:200px;
              overflow-y:auto; }
  #eventlog div { margin:2px 0; }
  #eventlog .new { color:#7ee787; animation:fadein 1s; }
  @keyframes fadein { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<div id="hud">
  <h1>🧬 DARWIN WORLD</h1>
  <div class="stat"><span>Population</span><b id="s-pop">–</b></div>
  <div class="stat"><span>Workers</span><b id="s-work">–</b></div>
  <div class="stat"><span>Species</span><b id="s-spec">–</b></div>
  <div class="stat"><span>Events (last)</span><b id="s-ev">–</b></div>
  <div class="stat"><span>Tick</span><b id="s-tick">–</b></div>
</div>
<div id="eventlog"><b style="color:#79c0ff">EVOLUTION FEED</b></div>
<div id="legend">
  <span class="dot" style="background:#7ee787"></span>strong skill
  <span class="dot" style="background:#f85149"></span>weak skill
  <span class="dot" style="background:#79c0ff"></span>worker (agent)
  <span class="dot" style="background:#d2a8ff"></span>species
  <span class="dot" style="background:#f0883e"></span>event spark
  <span style="color:#8b949e"> · height = fitness · orbit = rank</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d1117, 0.012);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d1117);
document.body.appendChild(renderer.domElement);

// orbit controls (lightweight manual)
let mx=0,my=0,mDown=false,theta=0.6,phi=1.1,camDist=45;
addEventListener('mousemove',e=>{ if(mDown){theta+=(e.clientX-mx)*.005; phi-=(e.clientY-my)*.005; phi=Math.max(.2,Math.min(1.5,phi));} mx=e.clientX; my=e.clientY;});
addEventListener('mousedown',()=>mDown=true);
addEventListener('mouseup',()=>mDown=false);
addEventListener('wheel',e=>{camDist=Math.max(15,Math.min(120,camDist+e.deltaY*.05));});
function updateCam(){
  camera.position.set(camDist*Math.sin(phi)*Math.cos(theta),
                      camDist*Math.cos(phi),
                      camDist*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(0,4,0);
}

// lights
scene.add(new THREE.AmbientLight(0x404040, 2));
const key = new THREE.PointLight(0x7ee787, 2, 100); key.position.set(0,30,0);
scene.add(key);

// ground grid
const grid = new THREE.GridHelper(80, 40, 0x30363d, 0x161b22);
scene.add(grid);

// central sun (the evolution core)
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(2.2, 32, 32),
  new THREE.MeshBasicMaterial({color:0x7ee787, wireframe:true}));
sun.position.y = 4;
scene.add(sun);

const organisms = {};  // id -> mesh
const sparks = [];

function colorFor(o){
  if(o.type==='worker') return 0x79c0ff;
  if(o.type==='species') return 0xd2a8ff;
  const f = o.fitness||0;
  // red (weak) -> green (strong)
  const t = Math.min(f/40, 1);
  return new THREE.Color(1-t, t*0.9+0.1, 0.2).getHex();
}
function geoFor(o){
  if(o.type==='worker') return new THREE.ConeGeometry(.9, 2.2, 6);
  if(o.type==='species') return new THREE.OctahedronGeometry(.9);
  return new THREE.SphereGeometry(.6 + Math.min((o.fitness||0)/40,1)*.8, 12, 12);
}

function syncWorld(world){
  document.getElementById('s-pop').textContent = world.stats.population;
  document.getElementById('s-work').textContent = world.stats.workers;
  document.getElementById('s-spec').textContent = world.stats.species_count;
  document.getElementById('s-ev').textContent = world.events.length;
  document.getElementById('s-tick').textContent = new Date().toLocaleTimeString();

  const seen = new Set();
  world.organisms.forEach(o=>{
    seen.add(o.id);
    let m = organisms[o.id];
    if(!m){
      // birth!
      const color = colorFor(o);
      m = new THREE.Mesh(geoFor(o), new THREE.MeshStandardMaterial({
        color, emissive:color, emissiveIntensity:.4, roughness:.4}));
      m.position.set(o.x, 0.1, o.z);  // start at ground, grow up
      m.userData.targetY = o.y; m.userData.born = Date.now();
      m.userData.spin = (Math.random()-.5)*.02;
      scene.add(m); organisms[o.id] = m;
      logEvent(`✨ birth: ${o.id}`, '#7ee787');
    } else {
      m.userData.targetY = o.y;
      m.material.color.setHex(colorFor(o));
    }
    m.userData.tx = o.x; m.userData.tz = o.z;
  });
  // death: remove unseen
  Object.keys(organisms).forEach(id=>{
    if(!seen.has(id)){
      const m = organisms[id];
      m.userData.dying = true;  // sink animation
    }
  });
  // event sparks
  world.events.slice(-6).forEach((e,i)=>{
    const c = e.kind==='speciation' ? '🌍' : e.kind==='trial_win' ? '🏆'
            : e.kind==='predation' ? '🦅' : e.kind==='gap-closure' ? '🎯'
            : e.kind==='crossover' ? '💞' : '🧬';
    logEvent(`${c} ${e.kind}: ${e.parent?.slice(0,18)} → ${e.child?.slice(0,18)}`, '#f0883e');
  });
}

const logEl = document.getElementById('eventlog');
function logEvent(text, color){
  const d = document.createElement('div');
  d.className='new'; d.style.color=color||'#c9d1d9'; d.textContent=text;
  logEl.prepend(d);
  while(logEl.children.length > 12) logEl.removeChild(logEl.lastChild);
}

let lastData = null;
function fetchWorld(){
  fetch('/api/world').then(r=>r.json()).then(w=>{
    lastData = w; syncWorld(w);
  }).catch(()=>{});
}
fetchWorld();
setInterval(fetchWorld, 5000);

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  sun.rotation.y = t*.3; sun.rotation.x = t*.15;
  Object.values(organisms).forEach(m=>{
    const u = m.userData;
    if(u.dying){
      m.position.y -= .15;
      if(m.position.y < -3){ scene.remove(m); delete organisms[
        Object.keys(organisms).find(k=>organisms[k]===m)]; }
      return;
    }
    // grow to target height
    m.position.y += (u.targetY - m.position.y)*.05;
    // gentle orbit drift
    m.position.x += (u.tx - m.position.x)*.02;
    m.position.z += (u.tz - m.position.z)*.02;
    m.rotation.y += u.spin;
    // pulse
    const pulse = 1 + Math.sin(t*2 + m.position.x)*0.04;
    m.scale.setScalar(pulse);
  });
  sparks.forEach((s,i)=>{ s.position.y += .2; s.material.opacity -= .02;
    if(s.material.opacity<=0){ scene.remove(s); sparks.splice(i,1);} });
  updateCam();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
