<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧬 Darwin World — Living Civilization</title>
<style>
  * { margin:0; padding:0; }
  body { overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }
  #hud { position:fixed; top:16px; left:16px; z-index:10; color:#7ee787;
         background:rgba(13,17,23,.88); border:1px solid #30363d;
         border-radius:12px; padding:14px 18px; min-width:240px; }
  #hud h1 { font-size:1rem; margin-bottom:6px; color:#7ee787; }
  .stat { display:flex; justify-content:space-between; gap:16px;
          font-size:.85rem; color:#c9d1d9; margin:2px 0; }
  .stat b { color:#79c0ff; }
  #legend { position:fixed; bottom:16px; left:16px; z-index:10;
            color:#8b949e; font-size:.78rem; background:rgba(13,17,23,.88);
            border:1px solid #30363d; border-radius:12px; padding:10px 14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%;
         margin-right:6px; vertical-align:middle; }
  #eventlog { position:fixed; top:16px; right:16px; z-index:10;
              color:#c9d1d9; font-size:.78rem; width:300px;
              background:rgba(13,17,23,.88); border:1px solid #30363d;
              border-radius:12px; padding:10px 14px; max-height:230px;
              overflow-y:auto; }
  #eventlog .new { color:#7ee787; animation:fadein .8s; }
  @keyframes fadein { from{opacity:0; transform:translateX(10px)} to{opacity:1} }
  /* identity card */
  #card { position:fixed; bottom:20px; right:20px; z-index:20; width:300px;
          background:linear-gradient(135deg,rgba(22,27,34,.96),rgba(13,17,23,.96));
          border:1px solid #30363d; border-radius:14px; padding:18px;
          color:#c9d1d9; display:none; box-shadow:0 8px 32px rgba(0,0,0,.6); }
  #card .name { font-size:1.15rem; font-weight:700; color:#7ee787; }
  #card .emoji { font-size:2rem; float:right; }
  #card .mood { color:#8b949e; font-size:.8rem; margin:2px 0 8px; }
  #card .bio { font-size:.82rem; line-height:1.5; margin:8px 0; }
  #card .traits { margin:8px 0; }
  #card .trait { display:inline-block; background:#21262d;
                 border:1px solid #30363d; border-radius:12px;
                 padding:2px 10px; font-size:.72rem; margin:2px 3px; color:#79c0ff; }
  #card .bars { margin-top:10px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin:4px 0;
             font-size:.75rem; color:#8b949e; }
  .bar { flex:1; height:6px; background:#21262d; border-radius:3px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:3px; transition:width .5s; }
  #card .record { font-size:.78rem; color:#8b949e; margin-top:6px; }
  #card .close { position:absolute; top:8px; right:12px; cursor:pointer;
                 color:#8b949e; font-size:1rem; }
  /* floating name labels */
  .name-label { position:fixed; pointer-events:none; z-index:5;
                color:#e6edf3; font-size:.72rem; font-weight:600;
                text-shadow:0 1px 3px #000; white-space:nowrap;
                transform:translate(-50%,-100%); }
  .name-label .emoji { font-size:.9rem; }
</style>
</head>
<body>
<div id="hud">
  <h1>🧬 DARWIN WORLD — Living Civilization</h1>
  <div class="stat"><span>Population</span><b id="s-pop">–</b></div>
  <div class="stat"><span>Workers</span><b id="s-work">–</b></div>
  <div class="stat"><span>Species</span><b id="s-spec">–</b></div>
  <div class="stat"><span>Tick</span><b id="s-tick">–</b></div>
</div>
<div id="eventlog"><b style="color:#79c0ff">📜 CHRONICLE</b></div>
<div id="legend">
  <span class="dot" style="background:#7ee787"></span>thriving
  <span class="dot" style="background:#79c0ff"></span>worker
  <span class="dot" style="background:#d2a8ff"></span>species
  <span class="dot" style="background:#f85149"></span>struggling
  <span style="color:#8b949e">· click an organism to meet it · drag to orbit · scroll to zoom</span>
</div>
<div id="card">
  <span class="close" onclick="closeCard()">✕</span>
  <div class="emoji" id="c-emoji">🙂</div>
  <div class="name" id="c-name">–</div>
  <div class="mood" id="c-mood">–</div>
  <div class="bio" id="c-bio">–</div>
  <div class="traits" id="c-traits"></div>
  <div class="bars">
    <div class="bar-row"><span style="width:50px">Fitness</span>
      <div class="bar"><div class="bar-fill" id="c-fit" style="background:#7ee787"></div></div>
      <span id="c-fitv">–</span></div>
    <div class="bar-row"><span style="width:50px">Energy</span>
      <div class="bar"><div class="bar-fill" id="c-en" style="background:#f0883e"></div></div>
      <span id="c-env">–</span></div>
  </div>
  <div class="record" id="c-record">–</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d1117, 0.011);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d1117);
document.body.appendChild(renderer.domElement);

let mx=0,my=0,mDown=false,theta=.6,phi=1.1,camDist=45;
addEventListener('mousemove',e=>{ if(mDown){theta+=(e.clientX-mx)*.005; phi-=(e.clientY-my)*.005; phi=Math.max(.25,Math.min(1.5,phi));} mx=e.clientX; my=e.clientY;});
addEventListener('mousedown',e=>{ if(e.target===renderer.domElement) mDown=true;});
addEventListener('mouseup',()=>mDown=false);
addEventListener('wheel',e=>{camDist=Math.max(15,Math.min(120,camDist+e.deltaY*.05));});
function updateCam(){
  camera.position.set(camDist*Math.sin(phi)*Math.cos(theta),
                      camDist*Math.cos(phi), camDist*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(0,4,0);
}

scene.add(new THREE.AmbientLight(0x404040, 2));
const key = new THREE.PointLight(0x7ee787, 2, 100); key.position.set(0,30,0);
scene.add(key);
scene.add(new THREE.GridHelper(80, 40, 0x30363d, 0x161b22));

const sun = new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32),
  new THREE.MeshBasicMaterial({color:0x7ee787, wireframe:true}));
sun.position.y = 4; scene.add(sun);

const organisms = {};  // id -> group
const labels = {};     // id -> div
const raycaster = new THREE.Raycaster();
const mouseV = new THREE.Vector2();

function moodColor(id){
  return id.identity ? id.identity.color.replace('#','0x') : 0x79c0ff;
}

function buildFace(group, identity, baseColor){
  // EYES: two white spheres with dark pupils
  const fp = identity.face_params || {eye_size:.8, eye_spacing:.4, mouth_curve:.3};
  const eyeGeo = new THREE.SphereGeometry(.14*fp.eye_size, 8, 8);
  const white = new THREE.MeshBasicMaterial({color:0xffffff});
  const dark = new THREE.MeshBasicMaterial({color:0x111111});
  [-1,1].forEach(side=>{
    const eye = new THREE.Mesh(eyeGeo, white);
    eye.position.set(side*fp.eye_spacing, .25, .5);
    group.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(.07,6,6), dark);
    pupil.position.set(side*fp.eye_spacing, .25, .6);
    group.add(pupil);
  });
  // MOUTH: curved torus segment
  const curve = fp.mouth_curve;
  const mouthGeo = new THREE.TorusGeometry(.22, .04, 6, 12, Math.PI);
  const mouth = new THREE.Mesh(mouthGeo,
    new THREE.MeshBasicMaterial({color:0x111111}));
  mouth.position.set(0, -.05 + curve*.1, .55);
  mouth.rotation.x = curve > 0 ? Math.PI : 0;  // smile vs frown
  mouth.rotation.z = Math.PI/2 * (curve>0?1:-1) * 0 + (curve>0?Math.PI:0);
  if(curve < 0) mouth.rotation.z = Math.PI;
  group.add(mouth);
  // blush dots for happy faces
  if(curve > .5){
    [-1,1].forEach(side=>{
      const blush = new THREE.Mesh(new THREE.SphereGeometry(.08,6,6),
        new THREE.MeshBasicMaterial({color:0xff6b81, transparent:true, opacity:.6}));
      blush.position.set(side*.45, -.05, .5);
      group.add(blush);
    });
  }
}

function syncWorld(world){
  document.getElementById('s-pop').textContent = world.stats.population;
  document.getElementById('s-work').textContent = world.stats.workers;
  document.getElementById('s-spec').textContent = world.stats.species_count;
  document.getElementById('s-tick').textContent = new Date().toLocaleTimeString();

  const seen = new Set();
  world.organisms.forEach(o=>{
    seen.add(o.id);
    const ident = o.identity || {};
    let group = organisms[o.id];
    if(!group){
      group = new THREE.Group();
      const color = new THREE.Color((ident.color||'#79c0ff').replace('#','0x'));
      const isWorker = o.type==='worker', isSpecies = o.type==='species';
      const geo = isWorker ? new THREE.CapsuleGeometry? new THREE.CapsuleGeometry(.7,1.4,4,8)
                  : new THREE.CylinderGeometry(.7,.9,2,8)
        : isSpecies ? new THREE.OctahedronGeometry(.9)
        : new THREE.SphereGeometry(.6 + Math.min((o.fitness||0)/40,1)*.7, 12, 12);
      const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color, emissive:color, emissiveIntensity:.35, roughness:.45}));
      group.add(body);
      // FACE (eyes + mouth) facing camera direction
      buildFace(group, ident, color);
      group.position.set(o.x, .1, o.z);
      group.userData = {targetY:o.y||2, born:Date.now(),
        spin:(Math.random()-.5)*.015, id:o.id, identity:ident, type:o.type,
        fitness:o.fitness, energy:o.energy, wins:o.wins, losses:o.losses,
        age:o.age_days};
      scene.add(group); organisms[o.id] = group;
      // floating name label
      const label = document.createElement('div');
      label.className = 'name-label';
      label.innerHTML = `<span class="emoji">${ident.emoji||'🙂'}</span> ${ident.name||o.id}`;
      document.body.appendChild(label);
      labels[o.id] = label;
      logEvent(`✨ ${ident.name||o.id} was born`, ident.color);
    }
    group.userData.targetY = o.y || 2;
  });
  Object.keys(organisms).forEach(id=>{
    if(!seen.has(id)) organisms[id].userData.dying = true;
  });
  // chronicle feed
  world.events.slice(-4).forEach(e=>{
    const ident = e.identity;
    const c = e.kind==='speciation'?'🌍':e.kind==='trial_win'?'🏆'
            :e.kind==='predation'?'🦅':e.kind==='gap-closure'?'🎯':e.kind==='crossover'?'💞':'🧬';
    logEvent(`${c} ${e.kind}: ${e.parent?.slice(0,20)} → ${e.child?.slice(0,20)}`, '#f0883e');
  });
}

const logEl = document.getElementById('eventlog');
function logEvent(text, color){
  const d = document.createElement('div');
  d.className='new'; d.style.color=color||'#c9d1d9'; d.textContent=text;
  logEl.prepend(d);
  while(logEl.children.length>14) logEl.removeChild(logEl.lastChild);
}

// click → identity card
addEventListener('click', e=>{
  if(mDown) return;
  mouseV.x = (e.clientX/innerWidth)*2-1;
  mouseV.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouseV, camera);
  const meshes = [];
  Object.values(organisms).forEach(g=>g.children.forEach(c=>meshes.push(c)));
  const hits = raycaster.intersectObjects(meshes, false);
  if(hits.length){
    // find parent group
    let obj = hits[0].object;
    while(obj.parent && !Object.values(organisms).includes(obj.parent)) obj = obj.parent;
    const group = Object.values(organisms).find(g=>g===obj || g.children.includes(hits[0].object));
    if(group && group.userData.identity) showCard(group.userData);
  } else closeCard();
});

function showCard(u){
  const id = u.identity;
  document.getElementById('card').style.display='block';
  document.getElementById('c-emoji').textContent = id.emoji||'🙂';
  document.getElementById('c-name').textContent = id.name||u.id;
  document.getElementById('c-mood').textContent = 'feeling ' + (id.mood||'ok');
  document.getElementById('c-bio').textContent = id.bio||'';
  document.getElementById('c-traits').innerHTML =
    (id.personality||[]).map(t=>`<span class="trait">${t}</span>`).join('');
  const f = Math.min(Math.max(u.fitness||0,0)/40*100, 100);
  const en = Math.min(Math.max(u.energy||0,0)/100*100, 100);
  document.getElementById('c-fit').style.width = f+'%';
  document.getElementById('c-fitv').textContent = (u.fitness||0).toFixed(1);
  document.getElementById('c-en').style.width = en+'%';
  document.getElementById('c-env').textContent = (u.energy||0).toFixed(0);
  document.getElementById('c-record').textContent =
    `⚔️ ${u.wins||0} victories · ${u.losses||0} defeats · ${u.age||0} days old`;
}
function closeCard(){ document.getElementById('card').style.display='none'; }

let lastData=null;
function fetchWorld(){
  fetch('/api/world').then(r=>r.json()).then(w=>{ lastData=w; syncWorld(w); }).catch(()=>{});
}
fetchWorld(); setInterval(fetchWorld, 5000);

const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  sun.rotation.y = t*.3; sun.rotation.x = t*.15;
  Object.entries(organisms).forEach(([id,m])=>{
    const u = m.userData;
    if(u.dying){ m.position.y -= .15;
      if(labels[id]) labels[id].style.display='none';
      if(m.position.y < -3){ scene.remove(m); delete organisms[id];
        if(labels[id]){labels[id].remove(); delete labels[id];} }
      return; }
    m.position.y += (u.targetY - m.position.y)*.05;
    m.position.x += (m.userData.tx||m.position.x - m.position.x)*0;  // keep
    m.rotation.y += u.spin;
    m.scale.setScalar(1 + Math.sin(t*2 + m.position.x)*.04);
    // faces look at camera
    m.lookAt(camera.position.x, m.position.y, camera.position.z);
    // update label position
    if(labels[id]){
      tmpV.copy(m.position); tmpV.y += 1.6; tmpV.project(camera);
      if(tmpV.z < 1){
        labels[id].style.display='block';
        labels[id].style.left = (tmpV.x*.5+.5)*innerWidth+'px';
        labels[id].style.top = (-tmpV.y*.5+.5)*innerHeight+'px';
      } else labels[id].style.display='none';
    }
  });
  updateCam();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
